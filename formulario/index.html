<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pé do meu namorado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
            <h1>Questionário para cozinhar na Towabalandia</h1>
        <label for="nome" required>Nome:</label>
        <input type="text" id="nome" placeholder="Digite a nomenclatura qual serás chamado em Towaba" required>
        <label for="motivo" required>Por que devemos aceitá-lo?</label>
        <input type="text" id="motivo" placeholder="Declarai suas mais genuínas e reais intenções">
        <select class="cursor" required>
            <option selected disabled hidden>Selecione uma virtude da vida</option>
            <option>JoJo's Bizarre Adventure</option>
            <option>Porquinhos da india</option>
            <option>Testemunhas de jeova</option>
            <option>Mongólia</option>
            <option>Oceanografia</option>
            <option>Sacolé de oreo</option>
        </select>
        <span>Selecione uma Marmota:</span>
<div>
    
        <input type="radio" name="marmota" class="cursor" id="marmota">
        <label for="marmota"> Marmota Grande
            <img src="image copy.png" alt="marmota 1" class="imagem">
        </label>
        <input type="radio" name="marmota" class="cursor" id="marmota2">
        <label for="marmota2">Marmota Pequena
            <img src="image.png" alt="mamorta 2" class="imagem">
        </label>
</div>
        <label for="protocolo">
            <input type="checkbox" id="protocolo" class="cursor">
            <span>
            Eu aceito o <strong><a href="https://pt.wikipedia.org/wiki/Proveta" target="_blank">Protocolo do Silêncio</a></strong>.
            </span>
        </label>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
